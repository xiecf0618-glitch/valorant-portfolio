<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Portfolio QA</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#c8ced6;font:12px Arial;color:#12202d}header{display:flex;align-items:center;gap:10px;padding:8px;height:48px;background:white}button,select,input{font:inherit;padding:5px}#canvas{position:relative;margin:8px;width:calc(100vw - 16px)}iframe{display:block;border:0;transform-origin:top left;background:#070b11}#report{max-width:1280px;white-space:pre-wrap;margin:10px;padding:12px;background:#fff;max-height:200px;overflow:auto}label{display:flex;gap:5px;align-items:center}
</style><header><label>视口<select id="viewport"><option>1440×900</option><option>1586×992</option><option>1366×768</option><option>390×844</option></select></label><label>Scene<select id="scene"></select></label><button id="previous">上一页</button><button id="next">下一页</button><button id="lower">向下半屏</button><button id="inspect">检查布局</button><button id="media">图像与证据</button><button id="record-motion">记录下一次动效</button><label><input type="checkbox" id="artoff">隐藏背景美术</label><label><input type="checkbox" id="fit">展开完整Scene</label></header><div id="canvas"><iframe id="site" title="作品集实际视口" src="../index.html"></iframe></div><pre id="report">载入中</pre><script>
const frame=document.querySelector('#site'), viewport=document.querySelector('#viewport'), scene=document.querySelector('#scene'), canvas=document.querySelector('#canvas');
for(let i=1;i<=23;i++){const o=document.createElement('option');o.value='scene'+String(i).padStart(2,'0');o.textContent=String(i).padStart(2,'0');scene.append(o)}
function dimensions(){return viewport.value.split('×').map(Number)}
function target(){return frame.contentDocument.getElementById(scene.value)}
function resize(){if(!target())return;let[w,h]=dimensions();if(document.querySelector('#fit').checked&&target())h=Math.ceil(target().getBoundingClientRect().height)+parseFloat(frame.contentWindow.getComputedStyle(frame.contentDocument.documentElement).getPropertyValue("--top"));frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(innerWidth-16)/w,document.querySelector('#fit').checked?(innerHeight-70)/h:1);frame.style.transform=`scale(${scale})`;canvas.style.height=h*scale+'px';frame.contentWindow.scrollTo({top:Math.max(0,target().offsetTop-parseFloat(frame.contentWindow.getComputedStyle(frame.contentDocument.documentElement).getPropertyValue("--top"))),behavior:'instant'});}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;if(!d?.documentElement||!target())return null;const reports=[...d.querySelectorAll('section.scene')].map(s=>{const r=s.getBoundingClientRect();return{id:s.id,width:r.width,height:Math.ceil(r.height),title:s.querySelector('h1,h2')?.textContent,headingFont:w.getComputedStyle(s.querySelector('h1,h2')).fontSize,minBodyFont:Math.min(...[...s.querySelectorAll('p,li,summary')].filter(e=>e.getClientRects().length).map(e=>parseFloat(w.getComputedStyle(e).fontSize))),overflow:[...s.querySelectorAll('h1,h2,h3,h4,p,article,table,ol,ul')].filter(e=>e.getClientRects().length&&e.scrollWidth>e.clientWidth+2).map(e=>({tag:e.tagName,class:e.className,text:e.textContent.slice(0,80),scroll:e.scrollWidth,client:e.clientWidth})),images:[...s.querySelectorAll('img')].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0,natural:[i.naturalWidth,i.naturalHeight],display:[Math.round(i.clientWidth),Math.round(i.clientHeight)]}))}});const result={viewport:[w.innerWidth,w.innerHeight],documentWidth:d.documentElement.scrollWidth,scenes:reports};document.querySelector('#report').textContent=JSON.stringify(result,null,2);return result}
function gotoScene(){if(!target())return;resize();inspect()}
viewport.onchange=gotoScene;scene.onchange=gotoScene;document.querySelector('#fit').onchange=gotoScene;document.querySelector('#previous').onclick=()=>{scene.selectedIndex=Math.max(0,scene.selectedIndex-1);gotoScene()};document.querySelector('#next').onclick=()=>{scene.selectedIndex=Math.min(22,scene.selectedIndex+1);gotoScene()};document.querySelector('#lower').onclick=()=>{frame.contentWindow.scrollBy({top:dimensions()[1]*.6,behavior:'instant'})};document.querySelector('#inspect').onclick=inspect;document.querySelector('#media').onclick=()=>{const m=target().querySelector('.ui-figure,.team-visual,.evidence-image,.agent-stage,.store-card .visual,.hero-art,.weapon-panel,.collection-figure,.wagu-visual');if(m)frame.contentWindow.scrollBy({top:m.getBoundingClientRect().top-80,behavior:'instant'});inspect()};
document.querySelector('#artoff').onchange=e=>{frame.contentDocument.documentElement.classList.toggle('qa-no-art',e.target.checked)};
frame.onload=()=>{const style=frame.contentDocument.createElement('style');style.textContent='html{scroll-behavior:auto!important}.qa-no-art .hero-map,.qa-no-art .hero-grid,.qa-no-art .hero-art,.qa-no-art .esports-bg,.qa-no-art .conclusion-map,.qa-no-art .agent-stage{visibility:hidden!important}.qa-no-art body:before,.qa-no-art body:after,.qa-no-art .scene:before,.qa-no-art .scene:after{display:none!important}';frame.contentDocument.head.append(style);gotoScene()};addEventListener('resize',resize);

// Manual QA: observe real animation frames after a visitor-triggered click.
// No production code, animation timing, or motion preference is altered.
document.querySelector('#record-motion').onclick=()=>{
 const d=frame.contentDocument,w=frame.contentWindow,output=document.querySelector('#report');
 output.textContent='已准备：请点击枪械检视或捷风。';
 const controls=[...d.querySelectorAll('[data-weapon-inspect],[data-jett-interact]')];
 function start(event){
  controls.forEach(control=>control.removeEventListener('click',start));
  const button=event.currentTarget,isWeapon=button.hasAttribute('data-weapon-inspect');
  const animated=isWeapon?[d.querySelector('[data-weapon-image]')]:[d.querySelector('[data-jett-portrait]'),...d.querySelectorAll('.jett-wind')];
  const report={control:isWeapon?'weapon':'jett',reduced:d.documentElement.dataset.reduceMotion,samples:[]};
  const started=w.performance.now();
  function sample(){
   const elapsed=w.performance.now()-started;
   report.samples.push({ms:Math.round(elapsed),visibility:d.visibilityState,elements:animated.map(e=>({transform:w.getComputedStyle(e).transform,opacity:w.getComputedStyle(e).opacity,animations:e.getAnimations().map(a=>({time:a.currentTime,state:a.playState}))}))});
   if(elapsed<1100)w.setTimeout(()=>w.requestAnimationFrame(sample),90);
   else output.textContent=JSON.stringify(report,null,2);
  }
  w.requestAnimationFrame(sample);
 }
 controls.forEach(control=>control.addEventListener('click',start,{once:true}));
};
</script></html>
